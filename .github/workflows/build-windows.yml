name: Build Windows

on:
  # 手动触发：Actions 页面点 Run workflow 即可产出 Windows 安装包
  workflow_dispatch:
  # 推 v* 标签时也自动构建（与 mac 版同版本号一起发）
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Build DSonDT for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/package-lock.json

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install root deps (tauri CLI)
        run: npm install

      - name: Install frontend deps
        run: cd src && npm install

      - name: Build Windows bundle (msi + nsis)
        # 在 Windows runner 上 tauri 会自动合并 tauri.windows.conf.json，
        # 仅产出 msi 与 nsis（mac 的 app/dmg 不受影响）。
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DSonDT-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis?/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis?/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
