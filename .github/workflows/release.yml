name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Apple Silicon target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Install frontend dependencies
        working-directory: src
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        # 注：本项目不做 Mac 签名/公证（无苹果开发者账号），不配置任何 APPLE_* Secret，
        # Tauri 会自动退化为 ad-hoc 签名出包；用户下载后需手动绕过 Gatekeeper（见 README）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src
          tagName: ${{ github.ref_name }}
          releaseName: DSonMac ${{ github.ref_name }}
          releaseBody: "DSonMac 本地 DeepSeek 桌面客户端（自带长期记忆）"
          releaseDraft: true
          prerelease: false
