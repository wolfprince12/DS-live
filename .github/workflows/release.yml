name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    # 临时禁用：此 workflow 一直构建失败且从未用于实际发布（mac 版一直本机手动发 Release）；
    # 保留文件备查。恢复自动发布时去掉此行并修复 tauri-action 构建步骤即可。
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Install frontend dependencies
        working-directory: src
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        # 注：本项目不做 Mac 签名/公证（无苹果开发者账号），不配置任何 APPLE_* Secret，
        # Tauri 会自动退化为 ad-hoc 签名出包；用户下载后需手动绕过 Gatekeeper（见 README）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src
          tagName: ${{ github.ref_name }}
          releaseName: DSonDT ${{ github.ref_name }}
          releaseBody: "DSonDT 本地 DeepSeek 桌面客户端（自带长期记忆）"
          releaseDraft: true
          prerelease: false