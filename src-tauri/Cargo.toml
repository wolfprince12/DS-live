[package]
name = "dsondt"
version = "0.1.0"
description = "本地运行的 DeepSeek 桌面客户端，自带长期记忆"
authors = ["wolfprince"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：启用单窗口多 webview（Window::add_child / Manager::get_webview）。
# 双模式共处一窗依赖它；API 不受 semver 保证，故版本锁死在 2.11.x。
tauri = { version = "~2.11", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
futures-util = "0.3"
anyhow = "1"
